name: Consistência da documentação

# Roda a cada Pull Request e push na main. Não depende da stack do projeto —
# usa apenas Node, sem dependências, então continua válido depois que a stack
# for decidida (ver issue #2).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # O nome deste job é o status check exigido pelo ruleset da `main`.
  # Renomeá-lo desliga a trava em silêncio: o ruleset passa a esperar um check
  # que nunca reporta, e o Pull Request fica travado para sempre.
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Antes de confiar no verificador, verificar o verificador.
      - name: Testes do check-docs
        run: node --test scripts/check-docs.test.mjs

      - name: Verificar consistência da documentação
        run: node scripts/check-docs.mjs
